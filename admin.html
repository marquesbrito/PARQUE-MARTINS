<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Painel Admin - Parque Haras Batista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 100%);
            min-height: 100vh;
            padding: 12px;
            color: #fff;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(12px);
            width: 100%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .logo i {
            font-size: 1.8rem;
        }

        .logo .titulo {
            font-size: 1.3rem;
        }

        .logo .acoes {
            margin-left: auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status {
            background: #22c55e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .status.erro {
            background: #ef4444;
        }

        .btn-voltar,
        .btn-sair {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-voltar:hover,
        .btn-sair:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-sair {
            background: rgba(239, 68, 68, 0.5);
        }

        .btn-sair:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .header-actions h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-actions h2 span {
            background: #fbbf24;
            color: #1a0a2e;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .btn-limpar {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-limpar:hover {
            background: #b91c1c;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            word-break: break-word;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: #fbbf24;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        td small {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        .badge-categoria {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            background: #fbbf24;
            color: #1a0a2e;
            white-space: nowrap;
        }

        .badge-categoria.aspirante {
            background: #7c3aed;
            color: #fff;
        }

        .badge-categoria.aberta {
            background: #dc2626;
            color: #fff;
        }

        .badge-categoria.feminino {
            background: #ec4899;
            color: #fff;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-delete:hover {
            background: #ef4444;
        }

        /* ===== TELA DE LOGIN ===== */
        #loginScreen .card {
            max-width: 400px;
            margin: 0 auto;
        }

        #loginScreen .logo {
            justify-content: center;
            font-size: 1.8rem;
        }

        #loginScreen h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a0a2e;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .msg-erro {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .empty-message {
            text-align: center;
            padding: 30px 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
        }

        /* ===== RESPONSIVIDADE ===== */

        /* Tablet */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 15px;
                border-radius: 18px;
            }

            .logo {
                font-size: 1.2rem;
                gap: 8px;
            }

            .logo .titulo {
                font-size: 1.1rem;
            }

            .logo i {
                font-size: 1.4rem;
            }

            .logo .acoes {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }

            .header-actions h2 {
                font-size: 1rem;
            }

            .btn-limpar {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            table {
                font-size: 0.8rem;
                min-width: 400px;
            }

            th,
            td {
                padding: 8px 10px;
            }

            .btn-delete {
                font-size: 0.7rem;
                padding: 4px 8px;
            }

            .badge-categoria {
                font-size: 0.65rem;
                padding: 2px 8px;
            }
        }

        /* Celular */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .card {
                padding: 12px;
                border-radius: 14px;
            }

            .logo {
                font-size: 1rem;
                gap: 6px;
            }

            .logo .titulo {
                font-size: 0.95rem;
            }

            .logo i {
                font-size: 1.2rem;
            }

            .logo .acoes {
                gap: 5px;
            }

            .btn-voltar,
            .btn-sair {
                font-size: 0.7rem;
                padding: 4px 10px;
            }

            .status {
                font-size: 0.65rem;
                padding: 2px 8px;
            }

            .header-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .header-actions h2 {
                font-size: 0.95rem;
                justify-content: center;
            }

            .header-actions h2 span {
                font-size: 0.8rem;
            }

            .btn-limpar {
                width: 100%;
                justify-content: center;
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            table {
                font-size: 0.7rem;
                min-width: 320px;
            }

            th,
            td {
                padding: 6px 8px;
            }

            th {
                font-size: 0.65rem;
            }

            .btn-delete {
                font-size: 0.6rem;
                padding: 3px 6px;
                gap: 3px;
            }

            .btn-delete i {
                font-size: 0.6rem;
            }

            .badge-categoria {
                font-size: 0.6rem;
                padding: 2px 6px;
            }

            td small {
                font-size: 0.6rem;
            }

            #loginScreen .logo {
                font-size: 1.4rem;
            }

            #loginScreen h2 {
                font-size: 1.1rem;
            }

            input {
                padding: 12px;
                font-size: 0.95rem;
            }

            .btn {
                padding: 14px;
                font-size: 1rem;
            }

            .empty-message {
                font-size: 0.8rem;
                padding: 20px 10px;
            }
        }

        /* Celular muito pequeno */
        @media (max-width: 360px) {
            table {
                min-width: 280px;
                font-size: 0.65rem;
            }

            th,
            td {
                padding: 4px 6px;
            }

            .logo .titulo {
                font-size: 0.8rem;
            }

            .btn-voltar,
            .btn-sair {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
        }

        /* Ajuste para touch */
        @media (hover: none) and (pointer: coarse) {
            .btn-limpar:hover {
                background: #dc2626;
            }

            .btn-delete:hover {
                background: rgba(239, 68, 68, 0.8);
            }

            .btn-voltar:hover,
            .btn-sair:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>

<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="loginScreen" class="admin-container">
        <div class="card">
            <div class="logo">
                <i class="fa-solid fa-lock"></i> Gestão
            </div>
            <h2>Acesso Restrito</h2>
            <input type="password" id="senhaAdmin" placeholder="Digite a senha..." autocomplete="current-password">
            <button id="btnEntrar" class="btn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <p id="msgErro" class="msg-erro">❌ Senha incorreta. Tente novamente.</p>
        </div>
    </div>

    <!-- ===== PAINEL ADMIN ===== -->
    <div id="painelScreen" class="admin-container hidden">
        <div class="card">
            <div class="logo">
                <i class="fa-solid fa-horse-head"></i>
                <span class="titulo">Painel Admin</span>
                <span id="statusFirebase" class="status"><i class="fas fa-circle"></i> Conectando...</span>
                <div class="acoes">
                    <a href="index.html" class="btn-voltar"><i class="fas fa-home"></i> Site</a>
                    <button id="btnSair" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</button>
                </div>
            </div>

            <div class="header-actions">
                <h2>📋 Senhas Registradas <span id="totalSenhas">0</span></h2>
                <button id="btnLimparTudo" class="btn-limpar"><i class="fas fa-trash-alt"></i> Limpar Todas</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Vaqueiro / Esteira</th>
                            <th>Categoria</th>
                            <th>Senha</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaSenhas">
                        <tr><td colspan="5" class="empty-message">🔄 Carregando inscrições...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
