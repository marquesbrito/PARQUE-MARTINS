<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Painel Admin - Parque Martins</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a2f1f 0%, #1a4730 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            font-weight: bold;
            color: #fbbf24;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: scale(1.02);
        }

        .btn-limpar {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-limpar:hover {
            background: #b91c1c;
        }

        .btn-sair,
        .btn-voltar {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            color: #0a2f1f;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        .status-conectado {
            background: #22c55e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="admin-container">
        <div class="card" style="max-width: 400px; margin: 0 auto;">
            <div class="logo" style="justify-content: center;">
                <i class="fa-solid fa-lock"></i> Gestão
            </div>
            <h2 style="text-align: center; margin-bottom: 20px;">Acesso Restrito</h2>

            <label for="senhaAdmin">Senha do Administrador</label>
            <input type="password" id="senhaAdmin" placeholder="Digite a senha..." style="margin-bottom: 20px;">

            <button id="btnEntrar" class="btn">Entrar</button>
            <p id="msgErro" style="color: #ef4444; text-align: center; margin-top: 15px; display: none;">Senha
                incorreta.</p>
        </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="painelScreen" class="admin-container hidden">
        <div class="card">
            <div class="logo">
                <i class="fa-solid fa-horse-head"></i>
                Painel Admin
                <span id="statusFirebase" class="status-conectado" style="margin-left: auto;">
                    <i class="fas fa-circle"></i> Conectado
                </span>
                <a href="index.html" class="btn-voltar" style="margin-left: 10px;">
                    <i class="fas fa-home"></i> Site
                </a>
                <button id="btnSair" class="btn-sair">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>

            <div
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
                <h2><i class="fas fa-list"></i> Senhas Registradas
                    <span id="totalSenhas"
                        style="background:#fbbf24; color:#000; font-size: 0.9rem; padding: 2px 8px; border-radius: 12px;">0</span>
                </h2>
                <button id="btnLimparTudo" class="btn-limpar">
                    <i class="fas fa-trash-alt"></i> LIMPAR TODAS SENHAS
                </button>
            </div>
            <p style="margin-bottom: 20px;">Clique em "Liberar" para liberar uma senha específica ou "LIMPAR TODAS" para
                apagar todas as inscrições.</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Vaqueiro / Esteira</th>
                            <th>Categoria</th>
                            <th>Senha</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaSenhas">
                        <tr>
                            <td colspan="5" style="text-align: center;">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAXQ3FhwX8KL-IQbj9j_5uQRK4qihgHvi0",
            authDomain: "aquejada-parque-martins.firebaseapp.com",
            projectId: "aquejada-parque-martins",
            storageBucket: "aquejada-parque-martins.firebasestorage.app",
            messagingSenderId: "806582025593",
            appId: "1:806582025593:web:d8764e8f399a74426c03a8"
        };



        let db = null;
        let unsubscribe = null;

        // Elementos
        const loginScreen = document.getElementById("loginScreen");
        const painelScreen = document.getElementById("painelScreen");
        const senhaAdminInput = document.getElementById("senhaAdmin");
        const btnEntrar = document.getElementById("btnEntrar");
        const btnSair = document.getElementById("btnSair");
        const msgErro = document.getElementById("msgErro");
        const statusFirebase = document.getElementById("statusFirebase");

        const SENHA_CORRETA = "admin123";

        // Verificar login salvo
        if (localStorage.getItem("adminLogado") === "true") {
            liberarPainel();
        }

        btnEntrar.addEventListener("click", () => {
            if (senhaAdminInput.value === SENHA_CORRETA) {
                localStorage.setItem("adminLogado", "true");
                liberarPainel();
            } else {
                msgErro.style.display = "block";
            }
        });

        btnSair.addEventListener("click", () => {
            localStorage.removeItem("adminLogado");
            if (unsubscribe) unsubscribe();
            painelScreen.classList.add("hidden");
            loginScreen.classList.remove("hidden");
            senhaAdminInput.value = "";
            msgErro.style.display = "none";
        });

        function liberarPainel() {
            loginScreen.classList.add("hidden");
            painelScreen.classList.remove("hidden");
            iniciarFirebase();
        }

        function iniciarFirebase() {
            if (db) return;

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                console.log("✅ Firebase conectado");
                if (statusFirebase) {
                    statusFirebase.innerHTML = '<i class="fas fa-circle"></i> Conectado';
                    statusFirebase.style.background = "#22c55e";
                }
                carregarTabela();

                const btnLimparTudo = document.getElementById("btnLimparTudo");
                if (btnLimparTudo) {
                    btnLimparTudo.addEventListener("click", limparTodasSenhas);
                }
            } catch (e) {
                console.error("Erro ao conectar:", e);
                if (statusFirebase) {
                    statusFirebase.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
                    statusFirebase.style.background = "#ef4444";
                }
            }
        }

        function formatarData(timestamp) {
            if (!timestamp) return "-";
            try {
                const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return data.toLocaleString('pt-BR');
            } catch (e) {
                return "-";
            }
        }

        async function limparTodasSenhas() {
            if (!confirm("⚠️ ATENÇÃO! Isso vai apagar TODAS as inscrições.\n\nAs senhas voltarão a ficar disponíveis.\n\nTem certeza?")) {
                return;
            }

            const confirmacao = prompt("Digite 'SIM' para confirmar a exclusão de TODOS os registros:");
            if (confirmacao !== "SIM") {
                alert("❌ Operação cancelada.");
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "senhas_registradas"));
                let deletados = 0;

                for (const docSnapshot of querySnapshot.docs) {
                    await deleteDoc(doc(db, "senhas_registradas", docSnapshot.id));
                    deletados++;
                }

                localStorage.removeItem("senhas_ocupadas_vaquejada");
                localStorage.removeItem("senhas_ocupadas");

                alert(`✅ ${deletados} inscrições removidas!\n\nTodas as senhas estão disponíveis novamente.`);
                location.reload();

            } catch (error) {
                console.error("Erro:", error);
                alert("❌ Erro: " + error.message);
            }
        }

        async function liberarSenha(docId) {
            if (!confirm("Liberar esta senha? Ela voltará a ficar disponível para nova inscrição.")) {
                return;
            }

            try {
                await deleteDoc(doc(db, "senhas_registradas", docId));
                alert("✅ Senha liberada com sucesso!");
            } catch (error) {
                alert("❌ Erro ao liberar: " + error.message);
            }
        }

        function carregarTabela() {
            const tabelaBody = document.getElementById("tabelaSenhas");
            const labelTotal = document.getElementById("totalSenhas");

            const senhasRef = collection(db, "senhas_registradas");

            unsubscribe = onSnapshot(senhasRef, (snapshot) => {
                tabelaBody.innerHTML = "";
                let count = 0;

                if (snapshot.empty) {
                    tabelaBody.innerHTML = `<tr><td colspan="5" style="text-align: center;">✅ Nenhuma inscrição cadastrada. Banco de dados limpo!</td></tr>`;
                    labelTotal.innerText = "0";
                    return;
                }

                snapshot.forEach((docSnapshot) => {
                    const dados = docSnapshot.data();
                    const idDoc = docSnapshot.id;
                    count++;

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${formatarData(dados.dataRegistro)}</td>
                        <td><strong>${dados.vaqueiro || '-'}</strong><br><small>Esteira: ${dados.esteira || '-'}</small></td>
                        <td><span style="background:#fbbf24; color:#000; padding:2px 8px; border-radius:12px;">${dados.categoria || '-'}</span></td>
                        <td><strong>${dados.senha || '-'}</strong></td>
                        <td>
                            <button class="btn-delete" data-id="${idDoc}">
                                <i class="fas fa-unlock-alt"></i> Liberar
                            </button>
                        </td>
                    `;
                    tabelaBody.appendChild(tr);
                });

                labelTotal.innerText = count;

                document.querySelectorAll(".btn-delete").forEach(button => {
                    button.addEventListener("click", async function () {
                        const docId = this.getAttribute("data-id");
                        await liberarSenha(docId);
                    });
                });
            }, (error) => {
                console.error("Erro no snapshot:", error);
                tabelaBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">❌ Erro ao carregar dados: ${error.message}</td></tr>`;
            });
        }
    </script>
</body>

</html>
