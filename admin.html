<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Parque Haras Batista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: #fbbf24;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-limpar {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-sair, .btn-voltar {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a0a2e;
        }

        .status {
            background: #22c55e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <div id="loginScreen" class="admin-container">
        <div class="card" style="max-width: 400px; margin: 0 auto;">
            <div class="logo" style="justify-content: center;">
                <i class="fa-solid fa-lock"></i> Gestão
            </div>
            <h2 style="text-align: center; margin-bottom: 20px;">Acesso Restrito</h2>
            <input type="password" id="senhaAdmin" placeholder="Digite a senha...">
            <button id="btnEntrar" class="btn" style="margin-top: 20px;">Entrar</button>
            <p id="msgErro" style="color: #ef4444; text-align: center; margin-top: 15px; display: none;">Senha incorreta</p>
        </div>
    </div>

    <div id="painelScreen" class="admin-container hidden">
        <div class="card">
            <div class="logo">
                <i class="fa-solid fa-horse-head"></i>
                Painel Admin - Haras Batista
                <span id="statusFirebase" class="status" style="margin-left: auto;">Conectando...</span>
                <a href="index.html" class="btn-voltar"><i class="fas fa-home"></i> Site</a>
                <button id="btnSair" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
                <h2>📋 Senhas Registradas <span id="totalSenhas" style="background:#fbbf24; color:#000; padding:2px 8px; border-radius:12px;">0</span></h2>
                <button id="btnLimparTudo" class="btn-limpar"><i class="fas fa-trash-alt"></i> LIMPAR TODAS</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Vaqueiro / Esteira</th><th>Categoria</th><th>Senha</th><th>Ação</th></tr>
                    </thead>
                    <tbody id="tabelaSenhas"><tr><td colspan="5">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXQ3FhwX8KL-IQbj9j_5uQRK4qihgHvi0",
            authDomain: "aquejada-parque-martins.firebaseapp.com",
            projectId: "aquejada-parque-martins",
            storageBucket: "aquejada-parque-martins.firebasestorage.app",
            messagingSenderId: "806582025593",
            appId: "1:806582025593:web:d8764e8f399a74426c03a8"
        };

        let db = null;
        let unsubscribe = null;

        const loginScreen = document.getElementById("loginScreen");
        const painelScreen = document.getElementById("painelScreen");
        const senhaInput = document.getElementById("senhaAdmin");
        const btnEntrar = document.getElementById("btnEntrar");
        const btnSair = document.getElementById("btnSair");
        const msgErro = document.getElementById("msgErro");

        const SENHA_CORRETA = "admin123";

        if (localStorage.getItem("adminLogado") === "true") {
            liberarPainel();
        }

        btnEntrar.addEventListener("click", () => {
            if (senhaInput.value === SENHA_CORRETA) {
                localStorage.setItem("adminLogado", "true");
                liberarPainel();
            } else {
                msgErro.style.display = "block";
            }
        });

        btnSair.addEventListener("click", () => {
            localStorage.removeItem("adminLogado");
            if (unsubscribe) unsubscribe();
            painelScreen.classList.add("hidden");
            loginScreen.classList.remove("hidden");
            senhaInput.value = "";
            msgErro.style.display = "none";
        });

        function liberarPainel() {
            loginScreen.classList.add("hidden");
            painelScreen.classList.remove("hidden");
            iniciarFirebase();
        }

        function iniciarFirebase() {
            if (db) return;
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                document.getElementById("statusFirebase").innerHTML = "<i class='fas fa-circle'></i> Conectado";
                carregarTabela();
                document.getElementById("btnLimparTudo").addEventListener("click", limparTodas);
            } catch (e) {
                document.getElementById("statusFirebase").innerHTML = "Erro";
            }
        }

        function formatarData(timestamp) {
            if (!timestamp) return "-";
            try {
                const data = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return data.toLocaleString('pt-BR');
            } catch (e) {
                return "-";
            }
        }

        async function limparTodas() {
            if (!confirm("⚠️ ATENÇÃO! Isso vai apagar TODAS as inscrições!")) return;
            if (prompt("Digite 'SIM' para confirmar") !== "SIM") return;

            const snapshot = await getDocs(collection(db, "senhas_registradas_2026"));
            let count = 0;
            for (const docSnap of snapshot.docs) {
                await deleteDoc(doc(db, "senhas_registradas_2026", docSnap.id));
                count++;
            }
            alert(`✅ ${count} inscrições removidas!`);
            location.reload();
        }

        async function liberarSenha(id) {
            if (!confirm("Liberar esta senha?")) return;
            await deleteDoc(doc(db, "senhas_registradas_2026", id));
            alert("✅ Senha liberada!");
        }

        function carregarTabela() {
            const tbody = document.getElementById("tabelaSenhas");
            const totalSpan = document.getElementById("totalSenhas");

            unsubscribe = onSnapshot(collection(db, "senhas_registradas_2026"), (snapshot) => {
                tbody.innerHTML = "";
                let count = 0;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5">✅ Nenhuma inscrição cadastrada</td></tr>`;
                    totalSpan.innerText = "0";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    count++;
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${formatarData(d.dataRegistro)}</td>
                        <td><strong>${d.vaqueiro || '-'}</strong><br><small>Esteira: ${d.esteira || '-'}</small></td>
                        <td><span style="background:#fbbf24; color:#000; padding:2px 8px; border-radius:12px;">${d.categoria || '-'}</span></td>
                        <td><strong>${d.senha || '-'}</strong></td>
                        <td><button class="btn-delete" data-id="${docSnap.id}"><i class="fas fa-unlock-alt"></i> Liberar</button></td>
                    `;
                    tbody.appendChild(tr);
                });

                totalSpan.innerText = count;

                document.querySelectorAll(".btn-delete").forEach(btn => {
                    btn.addEventListener("click", () => liberarSenha(btn.getAttribute("data-id")));
                });
            });
        }
    </script>
</body>

</html>
